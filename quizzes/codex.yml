# 📖 The Codex: every word you'll keep seeing, explained simply.
# Look one up with:  ./hunter codex <word>

terms:
  ip: "IP address. The address of a device on a network, like 192.168.56.101. Finds the MACHINE."
  port: "A numbered door on a machine (0-65535). Finds the PROGRAM. 22 = SSH, 80 = HTTP, 443 = HTTPS."
  tcp: "Transmission Control Protocol. Sets up a connection with a 3-way handshake (SYN, SYN-ACK, ACK) and checks everything arrives."
  udp: "User Datagram Protocol. Sends without a handshake or delivery check. Fast. Used by DNS, games, video calls."
  syn: "The first packet of a TCP handshake: 'can we talk?'. An nmap SYN scan sends only this and reads the reply."
  dns: "Domain Name System. The internet's phone book: turns google.com into an IP address."
  nat: "Network Address Translation. Many devices share one address. VirtualBox NAT lets your VM use the host's internet."
  host-only: "A VirtualBox network where VMs and the host can talk to each other but not the internet. Perfect for a hacking lab."
  subnet: "A slice of a network. 192.168.56.0/24 means the 256 addresses from 192.168.56.0 to 192.168.56.255."
  loopback: "127.0.0.1 or 'localhost'. Always means 'this same computer'."
  shell: "The program that reads your commands. On Kali it's zsh or bash. 'Getting a shell' on a box means you can run commands on it."
  bash: "The Bourne Again SHell. A shell and a scripting language for automating commands."
  root: "The all-powerful admin user on Linux (user id 0). 'Getting root' is the goal of most challenges."
  sudo: "'Superuser do'. Runs one command as root. 'sudo -l' lists what you're allowed to run."
  permission: "Who can read (r), write (w) and execute (x) a file, for the owner, group and everyone else. Example: -rwxr-x---"
  service: "A program running in the background, often listening on a port (sshd, apache2). Controlled with systemctl."
  banner: "Text a service sends when you connect, often naming its software and version. -sV reads banners."
  version: "Exact software version (OpenSSH 10.4p1). The key piece of recon: you look versions up for known bugs."
  cve: "Common Vulnerabilities and Exposures. A public ID for a known bug, like CVE-2014-0160 (Heartbleed)."
  vulnerability: "A weakness in software or setup that could let someone do something they shouldn't."
  exploit: "Code or steps that take advantage of a vulnerability. Only ever used in your lab or on practice platforms."
  payload: "What runs after an exploit works, for example opening a shell back to you."
  privesc: "Privilege escalation. Going from a normal user to root (or admin) on a machine."
  hash: "A one-way fingerprint of data. Systems store password hashes, not passwords. Same input = same hash."
  salt: "Random data added before hashing a password, so two people with the same password get different hashes."
  wordlist: "A big list of guesses (passwords, folder names). Kali ships rockyou.txt and dirb lists in /usr/share/wordlists."
  http: "The language browsers and web servers speak. Requests (GET, POST) and responses (200 OK, 404 Not Found)."
  cookie: "A small value a website stores in your browser, often to remember you're logged in (a session)."
  sqli: "SQL injection. Sneaking database commands into an input box because the site doesn't handle input safely."
  xss: "Cross-site scripting. Getting a website to run your JavaScript in other people's browsers."
  burp: "Burp Suite. A proxy that sits between your browser and a website so you can see and change requests."
  metasploit: "A framework full of exploits and tools. Practice it only on Metasploitable in your host-only lab."
  ctf: "Capture The Flag. Hacking challenges where you find hidden 'flags' to prove you solved them."
  box: "A practice machine you hack, like a VulnHub VM in your lab. 'Pwning a box' = fully solving it."
  recon: "Reconnaissance. Finding out everything about a target before touching it: hosts, ports, versions."
  scope: "The list of what you're ALLOWED to test. Anything outside scope is off-limits. Always."
  public-ip: "The one address your whole home shows to the internet. Websites, game servers and Discord's servers see it."
  private-ip: "An address that only works inside your home or lab: 10.x, 172.16-31.x, 192.168.x."
  cgnat: "Carrier-grade NAT. Your ISP puts many customers behind one public IP, common on mobile. Makes your 'location' your ISP's hub."
  isp: "Internet Service Provider. The company you pay for internet. The only one that knows which house used an IP."
  geolocation: "Guessing a place from an IP using databases. Country ~95-99% right, city ~50-80%, street address impossible."
  p2p: "Peer-to-peer. Players connect directly to each other, so they can see each other's IPs."
  relay: "A middleman server that passes game traffic between players so they never see each other's IPs."
  vpn: "Virtual Private Network. Sites and players see the VPN's IP instead of yours; the VPN company sees your traffic instead of your ISP."
  osint: "Open-Source Intelligence. Gathering information that's already public. How most doxxing really happens."
  doxxing: "Publishing someone's private details (real name, address, school) without permission. Harmful, and illegal in many places."
  ip-logger: "Just a website that saves the IP of everyone who opens it. Any site can do this. Don't open strangers' links."
  ddos: "Distributed Denial of Service. Flooding a connection until it drops. Illegal against anyone without permission."
  exif: "Hidden data inside photos: camera, date, sometimes GPS. View or strip it with exiftool."
  router: "The box that connects your home to the internet and does NAT. Change its default admin password."

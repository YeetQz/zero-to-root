  - { name: First Scan,       emoji: "📡", desc: Ran a first nmap scan,                    skill: Scan your own machine }
  - { name: Open Port Hunter, emoji: "🚪", desc: Watched a port flip from closed to open,  skill: Open vs closed vs filtered }
  - { name: Version Detective, emoji: "🕵️", desc: Identified exact software with -sV,      skill: Version detection with -sV }
  - { name: Dear Diary,       emoji: "📓", desc: Wrote a first hacker log,                  logs: 1 }
  - { name: Rank Up,          emoji: "⬆️", desc: Reached D-rank (level 5),                  level: 5 }
  - { name: Quiz Slayer,      emoji: "🧠", desc: Cleared a quest by passing its quiz,       quest: q02 }
  - { name: Lab Rat,          emoji: "🧪", desc: Finished the whole lab phase,              phase: lab }
  - { name: Terminal Wizard,  emoji: "🧙", desc: Finished Linux & networking basics,         phase: linux }
  - { name: Scriptsmith,      emoji: "⚒️", desc: Finished the Bash scripting path,          phase: bash }
  - { name: Dungeon Crawler,  emoji: "🏯", desc: Finished the free training grounds,        phase: free }
  - { name: Ghost,            emoji: "👻", desc: Finished the tracking & privacy path,      phase: track }
  - { name: On Fire,          emoji: "🔥", desc: Logged 7 days in a row,                    streak: 7 }
  - { name: First Blood,      emoji: "💀", desc: Wrote up a first hacked box,               boxes: 1 }
  - { name: Web Slinger,      emoji: "🕸️", desc: Finished the web hacking phase,            phase: web }
  - { name: C-Rank Hunter,    emoji: "🗡️", desc: Reached level 10,                          level: 10 }
  - { name: Root Collector,   emoji: "👑", desc: Wrote up 10 boxes,                         boxes: 10 }

name: 🤖 Keep README alive

on:
  push:
    branches: [main]
    paths:
      - "progress.yml"
      - "logs/**"
      - "writeups/**"
      - "scripts/**"
      - "README.md"
  schedule:
    - cron: "17 7 * * *"   # once a day, so the Day and Streak badges stay current
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install PyYAML
        run: pip install pyyaml==6.0.2

      - name: 🛠️ Redraw README and status window
        run: python scripts/update_readme.py

      - name: 💾 Commit if anything changed
        run: |
          git add README.md assets/status.svg
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "zero-to-root-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "🤖 [SYSTEM] Status updated"
          git push
